name: aios

services:
  control:
    build:
      context: ..
      dockerfile: aiOS-ui/docker/control.Dockerfile
    environment:
      AIOS_PROJECT_ROOT: /aios
      AIOS_PRIVATE_NOTES: /aios/sandbox-data/private-notes
      HERMES_SKIP_SUBPROCESS: "1"
      HERMES_SUB_HOST: hermes-webui
      HERMES_SUB_PORT: "8501"
      AGENTMEMORY_BASE_URL: http://agent-runtime:3113
      AGENTMEMORY_SECRET_FILE: /aios/sandbox-data/state/credentials/agentmemory-viewer-secret
      NPM_CONFIG_PREFIX: /aios/sandbox-data/state/tools/npm
      UV_TOOL_DIR: /aios/sandbox-data/state/tools/uv
      PATH: /aios/sandbox-data/state/tools/npm/bin:/aios/sandbox-data/state/tools/uv/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "127.0.0.1:${AIOS_PORT:-9119}:9119"
    volumes:
      - ../working-space:/workspace:rw
      - ../working-space:/aios/working-space:rw
      - ../outputs:/outputs:rw
      - ../outputs:/aios/outputs:rw
      - ../sandbox-data/my-data:/my-data:ro
      - ../sandbox-data/my-data:/aios/sandbox-data/my-data:ro
      - ../sandbox-data/state:/aios/sandbox-data/state:rw
      - ../sandbox-data/private-notes:/aios/sandbox-data/private-notes:rw
    command: ["python3", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "9119"]
    depends_on:
      hermes-webui:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    networks: [backend]

  agent-runtime:
    build:
      context: ..
      dockerfile: aiOS-ui/docker/control.Dockerfile
    environment:
      AIOS_PROJECT_ROOT: /aios
      AIOS_AGENT_CATALOG: /aios/aiOS-ui/config/agent-catalog.json
      AGENTMEMORY_HOME: /aios/sandbox-data/state/agentmemory
      CODEGRAPH_PROJECT: /aios/working-space
      NPM_CONFIG_PREFIX: /aios/sandbox-data/state/tools/npm
      UV_TOOL_DIR: /aios/sandbox-data/state/tools/uv
      PATH: /aios/sandbox-data/state/tools/npm/bin:/aios/sandbox-data/state/tools/uv/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ../working-space:/workspace:rw
      - ../working-space:/aios/working-space:rw
      - ../outputs:/outputs:rw
      - ../outputs:/aios/outputs:rw
      - ../sandbox-data/my-data:/my-data:ro
      - ../sandbox-data/my-data:/aios/sandbox-data/my-data:ro
      - ../sandbox-data/state:/aios/sandbox-data/state:rw
    command: ["python3", "-m", "services.runtime"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:3113', headers={'Host': 'localhost:3113'}); urllib.request.urlopen(request, timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    networks: [backend]

  hermes-webui:
    build:
      context: ..
      dockerfile: aiOS-ui/docker/hermes.Dockerfile
    environment:
      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: "8501"
      HERMES_WEBUI_DEFAULT_WORKSPACE: /workspace
      HERMES_HOME: /aios/sandbox-data/state/hermes
    volumes:
      - ../working-space:/workspace:rw
      - ../outputs:/outputs:rw
      - ../sandbox-data/state:/aios/sandbox-data/state:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    networks: [backend]

networks:
  backend:
    driver: bridge
