    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Custom subtle scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #8b949e;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #30363d transparent;
        }

        #top-bar {
            background-color: #0d1117;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #top-bar h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #top-bar h1 svg {
            flex-shrink: 0;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-group button {
            background: rgba(22,27,34,0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 7px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 8px;
            white-space: nowrap;
        }

        .btn-group button:hover {
            background: #21262d;
            border-color: #79c0ff;
            box-shadow: 0 0 16px rgba(121,192,255,0.2);
            color: #f0f6fc;
        }

        .btn-group button:hover svg {
            filter: drop-shadow(0 0 6px rgba(121,192,255,0.5));
        }

        .btn-group button svg {
            transition: filter 0.3s;
        }

        .dropdown {
            position: relative;
            display: inline-flex;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%) translateY(-4px);
            background: #161b22;
            min-width: 180px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 16px rgba(121,192,255,0.08);
            z-index: 100;
            border: 1px solid #30363d;
            border-radius: 10px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .dropdown-content.open {
            display: block;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .dropdown-content a {
            color: #c9d1d9;
            padding: 10px 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .dropdown-content a:hover {
            background: #21262d;
            color: #79c0ff;
        }
        .dropdown-content a svg {
            flex-shrink: 0;
        }
        .dropdown-sep {
            height: 1px;
            background: #30363d;
            margin: 2px 0;
        }

        #grid-wrapper {
            flex-grow: 1;
            position: relative;
            display: flex;
            overflow: hidden;
        }

        #grid {
            flex-grow: 1;
            display: grid;
            gap: 12px;
            background-color: transparent;
            overflow: hidden;
        }

        .splitter-v {
            cursor: col-resize;
            width: 8px;
            position: absolute;
            top: 0;
            bottom: 0;
            margin-left: -4px;
            z-index: 10;
            background: transparent;
            display: none;
        }

        .splitter-v:hover,
        .splitter-v.active {
            background: rgba(121, 192, 255, 0.4);
        }

        .splitter-h {
            cursor: row-resize;
            height: 8px;
            position: absolute;
            left: 0;
            right: 0;
            margin-top: -4px;
            z-index: 10;
            background: transparent;
            display: none;
        }

        .splitter-h:hover,
        .splitter-h.active {
            background: rgba(121, 192, 255, 0.4);
        }

        .term-container {
            background-color: #161b22;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
            min-width: 0;
            min-height: 0;
            border-radius: 14px;
            border: 1px solid #30363d;
            transition: border-color 0.2s;
        }

        .term-container:focus-within {
            border-color: rgba(121,192,255,0.4);
        }

        .term-header {
            background-color: #161b22;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            color: #8b949e;
            border-bottom: 1px solid #30363d;
        }

        .term-close {
            cursor: pointer;
        }

        .term-close:hover {
            color: #c9d1d9;
        }

        .term-body {
            flex-grow: 1;
            padding: 5px;
            position: relative;
            min-height: 0;
            overflow: hidden;
        }

        /* File Tree Styles */
        .ft-list {
            list-style-type: none;
            margin: 0;
            padding-left: 16px;
        }

        .ft-list.root {
            padding-left: 0;
        }

        .ft-item {
            margin: 2px 0;
        }

        .ft-row {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            color: #c9d1d9;
            user-select: none;
            transition: background 0.1s;
        }

        .ft-row:hover {
            background-color: #21262d;
        }

        .ft-row.active {
            background-color: #30363d;
        }

        .ft-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            margin-right: 8px;
            color: #8b949e;
            font-size: 14px;
        }

        .ft-name {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ft-meta {
            font-size: 11px;
            color: #8b949e;
            margin-left: 8px;
        }

        .ft-arrow {
            display: inline-block;
            width: 14px;
            font-size: 10px;
            color: #8b949e;
            transition: transform 0.2s;
        }

        .ft-arrow.open {
            transform: rotate(90deg);
        }

        .ft-empty {
            padding: 6px 10px 6px 38px;
            color: #484f58;
            font-style: italic;
            font-size: 13px;
        }

        /* Context Menu Styles */
        .ctx-menu {
            position: absolute;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 4px 0;
            min-width: 160px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
            z-index: 1000;
            display: none;
            font-size: 13px;
        }

        .ctx-item {
            padding: 6px 12px;
            color: #c9d1d9;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .ctx-item:hover {
            background: #21262d;
        }

        .ctx-item.has-submenu::after {
            content: '▶';
            font-size: 10px;
            color: #8b949e;
        }

        .ctx-submenu {
            position: absolute;
            top: 0;
            left: 100%;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 4px 0;
            min-width: 140px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
            display: none;
        }

        .ctx-menu.left-submenus .ctx-submenu {
            left: auto;
            right: 100%;
        }

        .ctx-item:hover>.ctx-submenu {
            display: block;
        }

        .ctx-divider {
            height: 1px;
            background: #30363d;
            margin: 4px 0;
        }

        /* Workspace auto-refresh styles */
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.6; }
        }
        .pulse-dot {
            animation: pulse 2s infinite ease-in-out;
        }
        
        #workspace-refresh-btn:hover {
            color: #c9d1d9;
            background-color: #21262d;
        }
        
        #workspace-refresh-btn.spinning .refresh-icon {
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="top-bar">
        <h1><svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="8" width="36" height="32" rx="4" stroke="#79c0ff" stroke-width="2.5"/><path d="M14 20l6 5-6 5" stroke="#79c0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 30h10" stroke="#79c0ff" stroke-width="2.5" stroke-linecap="round"/></svg>Terminals</h1>
        <div class="btn-group">
            <button onclick="toggleWorkspacePanel()">
                <svg width="16" height="16" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 14V38a2 2 0 002 2h28a2 2 0 002-2V18a2 2 0 00-2-2H24l-4-4H10a2 2 0 00-2 2z" stroke="#79c0ff" stroke-width="2.5" stroke-linejoin="round"/>
                    <path d="M8 22h32" stroke="#79c0ff" stroke-width="2"/>
                </svg>
                Workspace
            </button>
            <div class="dropdown" id="add-term-dropdown">
                <button onclick="toggleAddTermMenu(event)">
                    <svg width="16" height="16" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="6" y="8" width="36" height="32" rx="4" stroke="#79c0ff" stroke-width="2.5"/>
                        <path d="M24 18v12M18 24h12" stroke="#79c0ff" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                    Add Terminal
                    <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 4l3 3 3-3" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="dropdown-content" id="add-term-menu">
                    <a onclick="addTerminal(); closeAddTermMenu()">
                        <svg width="14" height="14" viewBox="0 0 48 48" fill="none"><rect x="6" y="8" width="36" height="32" rx="4" stroke="#8b949e" stroke-width="2.5"/><path d="M14 20l6 5-6 5" stroke="#8b949e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 30h10" stroke="#8b949e" stroke-width="2.5" stroke-linecap="round"/></svg>
                        Normal Terminal
                    </a>
                    <div class="dropdown-sep"></div>
                    <a onclick="addTerminal('root'); closeAddTermMenu()">
                        <svg width="14" height="14" viewBox="0 0 48 48" fill="none"><rect x="6" y="8" width="36" height="32" rx="4" stroke="#ff7b72" stroke-width="2.5"/><path d="M14 20l6 5-6 5" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 30h10" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round"/></svg>
                        Root Terminal
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div id="main-content" style="flex-grow: 1; display: flex; overflow: hidden; padding: 0 24px 24px 24px; gap: 16px;">
        <div id="grid-wrapper">
            <div id="grid">
                <!-- Terminals will be added here -->
            </div>
            <div id="v-splitter" class="splitter-v"></div>
            <div id="h-splitter" class="splitter-h"></div>
        </div>
        <div id="workspace-panel"
            style="width: 280px; background-color: #161b22; border: 1px solid #30363d; border-radius: 14px; display: none; flex-direction: column; overflow-y: auto;">
            <div
                style="padding: 12px 16px; font-weight: bold; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; color: #8b949e;">
                <span style="font-size: 12px; letter-spacing: 0.5px;">WORKSPACE FILES</span>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <!-- Auto refresh status indicator + toggle -->
                    <span id="auto-refresh-badge" onclick="toggleAutoRefresh(event)" style="font-size: 10px; color: #56d364; display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none;" title="Auto-refreshing every 5s. Click to pause.">
                        <span class="pulse-dot" style="width: 6px; height: 6px; background-color: #56d364; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #56d364;"></span>
                        Live
                    </span>
                    <!-- Manual refresh button -->
                    <button id="workspace-refresh-btn" onclick="refreshWorkspace(event)" style="background: transparent; border: none; padding: 4px; color: #8b949e; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 4px; transition: color 0.2s, background-color 0.2s;" title="Refresh workspace">
                        <svg class="refresh-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                            <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                            <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                        </svg>
                    </button>
                    <!-- Close button -->
                    <span style="cursor:pointer; color: #c9d1d9; font-size: 14px; padding: 4px;" onclick="toggleWorkspacePanel()">✖</span>
                </div>
            </div>
            <div id="file-tree" style="padding: 12px 16px; font-size: 14px;">
                Loading...
            </div>
        </div>
    </div>

    <script>
        // ── Add Terminal dropdown (click-based) ──
        function toggleAddTermMenu(e) {
            e.stopPropagation();
            var menu = document.getElementById('add-term-menu');
            menu.classList.toggle('open');
        }
        function closeAddTermMenu() {
            document.getElementById('add-term-menu').classList.remove('open');
        }
        document.addEventListener('click', function(e) {
            var dropdown = document.getElementById('add-term-dropdown');
            if (dropdown && !dropdown.contains(e.target)) closeAddTermMenu();
        });

        const grid = document.getElementById('grid');
        let termCount = 0;
        let terms = {}; // Use object instead of array to prevent holes breaking index logic

        const observer = new ResizeObserver(entries => {
            for (let entry of entries) {
                const id = entry.target.dataset.id;
                if (id !== undefined && terms[id] && terms[id].fitAddon) {
                    terms[id].fitAddon.fit();
                }
            }
        });

        let colPercent = 50;
        let rowPercent = 50;
        const vSplitter = document.getElementById('v-splitter');
        const hSplitter = document.getElementById('h-splitter');
        const gridWrapper = document.getElementById('grid-wrapper');

        function setupSplitters() {
            let isDraggingV = false;
            let isDraggingH = false;

            vSplitter.addEventListener('mousedown', (e) => {
                isDraggingV = true;
                vSplitter.classList.add('active');
                document.body.style.cursor = 'col-resize';
                e.preventDefault();
            });

            hSplitter.addEventListener('mousedown', (e) => {
                isDraggingH = true;
                hSplitter.classList.add('active');
                document.body.style.cursor = 'row-resize';
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDraggingV && !isDraggingH) return;
                const rect = gridWrapper.getBoundingClientRect();
                if (isDraggingV) {
                    let p = ((e.clientX - rect.left) / rect.width) * 100;
                    colPercent = Math.max(10, Math.min(90, p));
                    updateGridClass(false);
                }
                if (isDraggingH) {
                    let p = ((e.clientY - rect.top) / rect.height) * 100;
                    rowPercent = Math.max(10, Math.min(90, p));
                    updateGridClass(false);
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDraggingV || isDraggingH) {
                    isDraggingV = false;
                    isDraggingH = false;
                    vSplitter.classList.remove('active');
                    hSplitter.classList.remove('active');
                    document.body.style.cursor = 'default';
                    setTimeout(() => {
                        Object.values(terms).forEach(t => {
                            if (t && t.fitAddon) t.fitAddon.fit();
                        });
                    }, 50);
                }
            });
        }
        setupSplitters();

        let lastCount = 0;
        function updateGridClass(forceRefit = true) {
            const activeWraps = Array.from(grid.children);
            const count = activeWraps.length;

            if (count === 1) {
                grid.style.gridTemplateColumns = '1fr';
                grid.style.gridTemplateRows = '1fr';
                vSplitter.style.display = 'none';
                hSplitter.style.display = 'none';
            } else if (count === 2) {
                grid.style.gridTemplateColumns = `${colPercent}% 1fr`;
                grid.style.gridTemplateRows = '1fr';
                vSplitter.style.display = 'block';
                vSplitter.style.left = `${colPercent}%`;
                hSplitter.style.display = 'none';
            } else if (count >= 3) {
                grid.style.gridTemplateColumns = `${colPercent}% 1fr`;
                grid.style.gridTemplateRows = `${rowPercent}% 1fr`;
                vSplitter.style.display = 'block';
                vSplitter.style.left = `${colPercent}%`;
                hSplitter.style.display = 'block';
                hSplitter.style.top = `${rowPercent}%`;
            }

            activeWraps.forEach((wrap, index) => {
                wrap.style.width = '100%';
                wrap.style.height = '100%';
                if (count === 3 && index === 2) {
                    wrap.style.gridColumn = '1 / span 2';
                } else {
                    wrap.style.gridColumn = 'auto';
                }
            });

            if (forceRefit || count !== lastCount) {
                setTimeout(() => {
                    Object.values(terms).forEach(t => {
                        if (t && t.fitAddon) t.fitAddon.fit();
                    });
                }, 50);
                lastCount = count;
            }
        }

        function removeTerminal(id) {
            const container = document.getElementById('term-wrap-' + id);
            if (container) {
                observer.unobserve(container);
                container.remove();
            }

            const termData = terms[id];
            if (termData) {
                delete terms[id];
                setTimeout(() => {
                    try { if (termData.ws) termData.ws.close(); } catch (e) { console.error(e); }
                    try { termData.term.dispose(); } catch (e) { console.error(e); }
                }, 10);
            }
            updateGridClass();
        }

        function addTerminal(user = 'ai_user') {
            const activeCount = Object.keys(terms).length;
            if (activeCount >= 4) {
                alert("Maximum 4 terminals allowed.");
                return;
            }

            const id = termCount++;

            const wrap = document.createElement('div');
            wrap.className = 'term-container';
            wrap.id = 'term-wrap-' + id;
            wrap.dataset.id = id;
            observer.observe(wrap);

            const header = document.createElement('div');
            header.className = 'term-header';
            header.innerHTML = `<span>Terminal ${id + 1}</span><span class="term-close" onclick="removeTerminal(${id})" style="cursor:pointer; padding:0 5px; background:rgba(255,255,255,0.1); border-radius:3px;">✖</span>`;

            const body = document.createElement('div');
            body.className = 'term-body';

            wrap.appendChild(header);
            wrap.appendChild(body);
            grid.appendChild(wrap);

            const term = new Terminal({
                cursorBlink: true,
                fontFamily: '"FiraCode Nerd Font", "MesloLGS NF", "Hack Nerd Font", "JetBrainsMono Nerd Font", "UbuntuMono Nerd Font", "Cascadia Code PL", monospace',
                fontSize: 14,
                letterSpacing: 1,
                theme: {
                    background: '#161b22',
                    foreground: '#c9d1d9',
                    cursor: '#79c0ff',
                    cursorAccent: '#161b22',
                    selection: 'rgba(121, 192, 255, 0.3)',
                    black: '#161b22',
                    red: '#ff7b72',
                    green: '#3fb950',
                    yellow: '#d29922',
                    blue: '#58a6ff',
                    magenta: '#bc8cff',
                    cyan: '#79c0ff',
                    white: '#c9d1d9',
                    brightBlack: '#484f58',
                    brightRed: '#ffa198',
                    brightGreen: '#56d364',
                    brightYellow: '#e3b341',
                    brightBlue: '#79c0ff',
                    brightMagenta: '#d2a8ff',
                    brightCyan: '#a5d6ff',
                    brightWhite: '#f0f6fc'
                }
            });

            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(body);
            fitAddon.fit();

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/terminal?user=${user}`;
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: 'resize',
                    cols: term.cols,
                    rows: term.rows
                }));
            };

            ws.onmessage = async (evt) => {
                let data = evt.data;
                if (data instanceof Blob) {
                    data = await data.text();
                }
                term.write(data);
            };

            term.onData(data => {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'data', data: data }));
                }
            });

            term.onResize(size => {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'resize', cols: size.cols, rows: size.rows }));
                }
            });

            wrap.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'copy';
            });
            wrap.addEventListener('drop', (e) => {
                const text = e.dataTransfer.getData('text/plain');
                if (text) {
                    e.preventDefault();
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'data', data: text }));
                    }
                }
            });

            terms[id] = { term, fitAddon, ws };
            updateGridClass();
        }

        // Global resize listener for window
        window.addEventListener('resize', () => {
            Object.values(terms).forEach(t => {
                if (t && t.fitAddon) {
                    try { t.fitAddon.fit(); } catch (e) { }
                }
            });
        });

        // Initialize first terminal
        addTerminal();

        let workspacePanelOpen = false;
        let autoRefreshInterval = null;
        let autoRefreshEnabled = true;

        function startAutoRefresh() {
            stopAutoRefresh();
            if (!autoRefreshEnabled || !workspacePanelOpen) return;
            autoRefreshInterval = setInterval(async () => {
                await refreshWorkspace();
            }, 5000);
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        function toggleAutoRefresh(e) {
            if (e) e.stopPropagation();
            autoRefreshEnabled = !autoRefreshEnabled;
            const badge = document.getElementById('auto-refresh-badge');
            const dot = badge.querySelector('.pulse-dot');
            const textNode = badge.lastChild;
            
            if (autoRefreshEnabled) {
                badge.style.color = '#56d364';
                badge.title = "Auto-refreshing every 5s. Click to pause.";
                dot.style.backgroundColor = '#56d364';
                dot.style.boxShadow = '0 0 8px #56d364';
                dot.style.animation = 'pulse 2s infinite ease-in-out';
                textNode.textContent = ' Live';
                startAutoRefresh();
            } else {
                badge.style.color = '#8b949e';
                badge.title = "Auto-refresh paused. Click to resume.";
                dot.style.backgroundColor = '#8b949e';
                dot.style.boxShadow = 'none';
                dot.style.animation = 'none';
                textNode.textContent = ' Paused';
                stopAutoRefresh();
            }
        }

        async function refreshWorkspace(e) {
            if (e) e.stopPropagation();
            const btn = document.getElementById('workspace-refresh-btn');
            if (btn) btn.classList.add('spinning');
            
            const fileTree = document.getElementById('file-tree');
            if (fileTree) {
                const expandedPaths = [];
                document.querySelectorAll('#file-tree .ft-row').forEach(row => {
                    if (row.dataset.isdir === "true") {
                        const childrenContainer = row.nextElementSibling;
                        if (childrenContainer && childrenContainer.style.display === 'block') {
                            expandedPaths.push(row.dataset.path);
                        }
                    }
                });
                
                try {
                    await loadFiles('/workspace', fileTree, expandedPaths);
                } catch (err) {
                    console.error(err);
                }
            }
            
            if (btn) {
                setTimeout(() => {
                    btn.classList.remove('spinning');
                }, 500);
            }
        }

        function toggleWorkspacePanel() {
            workspacePanelOpen = !workspacePanelOpen;
            const panel = document.getElementById('workspace-panel');
            panel.style.display = workspacePanelOpen ? 'flex' : 'none';
            if (workspacePanelOpen) {
                if (document.getElementById('file-tree').innerHTML.includes('Loading')) {
                    loadFiles('/workspace', document.getElementById('file-tree'));
                }
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
            updateGridClass();
        }

        // File tree helper functions
        function formatBytes(bytes, decimals = 1) {
            if (!+bytes) return '0b';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['b', 'k', 'm', 'g', 't'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))}${sizes[i]}`;
        }

        const SVG_FOLDER = `<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.543l-1.6-1.6A1.75 1.75 0 0 0 4.707 1H1.75ZM1.5 2.75a.25.25 0 0 1 .25-.25h2.957a.25.25 0 0 1 .177.073l1.6 1.6A.25.25 0 0 0 6.661 4.5h7.589a.25.25 0 0 1 .25.25v8.5a.25.25 0 0 1-.25.25H1.75a.25.25 0 0 1-.25-.25V2.75Z"></path></svg>`;
        const SVG_FILE = `<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16H3.75A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"></path></svg>`;

        async function loadFiles(path, container, expandedPaths = null) {
            try {
                if (path.endsWith('/') && path !== '/') {
                    path = path.slice(0, -1);
                }
                const res = await fetch('/api/files/list?path=' + encodeURIComponent(path));
                const data = await res.json();

                container.innerHTML = '';

                if (data.entries && data.entries.length > 0) {
                    // Sort dirs first, then files
                    data.entries.sort((a, b) => {
                        if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
                        return a.name.localeCompare(b.name);
                    });

                    const ul = document.createElement('ul');
                    ul.className = 'ft-list' + (path === '/workspace' ? ' root' : '');

                    data.entries.forEach(entry => {
                        const li = document.createElement('li');
                        li.className = 'ft-item';

                        const fullPath = path === '/' ? '/' + entry.name : path + '/' + entry.name;

                        if (entry.type === 'dir') {
                            const dirRow = document.createElement('div');
                            dirRow.className = 'ft-row';
                            dirRow.draggable = true;
                            dirRow.dataset.path = fullPath;
                            dirRow.dataset.isdir = "true";

                            dirRow.ondragstart = (e) => {
                                const textToDrop = '@"' + fullPath + '/" ';
                                e.dataTransfer.setData('text/plain', textToDrop);
                            };

                            const arrow = document.createElement('span');
                            arrow.className = 'ft-arrow';
                            arrow.innerHTML = '▶';

                            const icon = document.createElement('span');
                            icon.className = 'ft-icon';
                            icon.innerHTML = SVG_FOLDER;

                            const name = document.createElement('span');
                            name.className = 'ft-name';
                            name.textContent = entry.name;

                            dirRow.appendChild(arrow);
                            dirRow.appendChild(icon);
                            dirRow.appendChild(name);

                            const childrenContainer = document.createElement('div');
                            childrenContainer.style.display = 'none';

                            if (expandedPaths && expandedPaths.includes(fullPath)) {
                                arrow.classList.add('open');
                                childrenContainer.style.display = 'block';
                                loadFiles(fullPath, childrenContainer, expandedPaths);
                            }

                            dirRow.onclick = () => {
                                const isOpen = childrenContainer.style.display === 'block';
                                if (!isOpen) {
                                    arrow.classList.add('open');
                                    childrenContainer.style.display = 'block';
                                    if (childrenContainer.innerHTML === '') {
                                        loadFiles(fullPath, childrenContainer);
                                    }
                                } else {
                                    arrow.classList.remove('open');
                                    childrenContainer.style.display = 'none';
                                }
                            };

                            li.appendChild(dirRow);
                            li.appendChild(childrenContainer);
                        } else {
                            const fileRow = document.createElement('div');
                            fileRow.className = 'ft-row';
                            fileRow.style.paddingLeft = '24px'; // align with folder text
                            fileRow.draggable = true;
                            fileRow.dataset.path = fullPath;
                            fileRow.dataset.isdir = "false";

                            const icon = document.createElement('span');
                            icon.className = 'ft-icon';
                            icon.innerHTML = SVG_FILE;

                            const name = document.createElement('span');
                            name.className = 'ft-name';
                            name.textContent = entry.name;

                            const size = document.createElement('span');
                            size.className = 'ft-meta';
                            size.textContent = entry.size !== null ? formatBytes(entry.size) : '';

                            fileRow.appendChild(icon);
                            fileRow.appendChild(name);
                            fileRow.appendChild(size);

                            fileRow.ondragstart = (e) => {
                                const textToDrop = '@"' + fullPath + '" ';
                                e.dataTransfer.setData('text/plain', textToDrop);
                            };

                            li.appendChild(fileRow);
                        }
                        ul.appendChild(li);
                    });
                    container.appendChild(ul);
                } else {
                    container.innerHTML = '<div class="ft-empty">(empty)</div>';
                }
            } catch (err) {
                container.innerHTML = `<div style="color: #ff7b72; padding: 10px; font-size: 13px;">Error: ${err.message}</div>`;
            }
        }
        // Context Menu Logic
        const ctxMenu = document.createElement('div');
        ctxMenu.className = 'ctx-menu';
        document.body.appendChild(ctxMenu);

        document.addEventListener('click', () => {
            ctxMenu.style.display = 'none';
        });

        function sendToTerminal(termId, cmd) {
            const t = terms[termId];
            if (t && t.ws && t.ws.readyState === WebSocket.OPEN) {
                t.ws.send(JSON.stringify({ type: 'data', data: cmd + '\r' }));
            }
        }

        function sendToNewTerminal(cmd) {
            addTerminal();
            const newId = termCount - 1;
            setTimeout(() => {
                sendToTerminal(newId, cmd);
            }, 500);
        }

        document.getElementById('workspace-panel').addEventListener('contextmenu', (e) => {
            const row = e.target.closest('.ft-row');
            if (!row) return;
            e.preventDefault();

            const fullPath = row.dataset.path;
            const isDir = row.dataset.isdir === "true";

            let html = '';

            let termSubmenu = '<div class="ctx-submenu">';
            Object.keys(terms).forEach(id => {
                termSubmenu += `<div class="ctx-item" data-action="term" data-termid="${id}">Terminal ${parseInt(id) + 1}</div>`;
            });
            termSubmenu += '</div>';

            if (isDir) {
                html += `
                    <div class="ctx-item has-submenu" data-type="cd">
                        Open Directory
                        ${termSubmenu}
                    </div>
                `;
            } else {
                html += `
                    <div class="ctx-item has-submenu" data-type="vim">
                        Edit File
                        ${termSubmenu}
                    </div>
                    <div class="ctx-item has-submenu" data-type="cat">
                        View File
                        ${termSubmenu}
                    </div>
                `;
                if (fullPath.endsWith('.py')) {
                    html += `
                        <div class="ctx-item has-submenu" data-type="python">
                            Run Python
                            ${termSubmenu}
                        </div>
                    `;
                } else if (fullPath.endsWith('.sh')) {
                    html += `
                        <div class="ctx-item has-submenu" data-type="sh">
                            Run Script
                            ${termSubmenu}
                        </div>
                    `;
                }
            }

            html += '<div class="ctx-divider"></div>';
            html += `<div class="ctx-item" data-action="newterm" data-type="${isDir ? 'cd' : 'vim'}">Open in New Terminal</div>`;

            let relPath = fullPath;
            if (fullPath.startsWith('/workspace/')) {
                relPath = fullPath.substring(11);
            }
            html += `<div class="ctx-item" data-action="copy" data-val="${fullPath}">Copy Absolute Path</div>`;
            html += `<div class="ctx-item" data-action="copy" data-val="${relPath}">Copy Relative Path</div>`;

            ctxMenu.innerHTML = html;
            ctxMenu.style.display = 'block';

            let x = e.clientX;
            let y = e.clientY;

            // Render quickly to measure offsetHeight
            const menuHeight = ctxMenu.offsetHeight;
            if (x + 160 > window.innerWidth) x = window.innerWidth - 160;
            if (y + menuHeight > window.innerHeight) y = window.innerHeight - menuHeight;
            
            // Check if submenus will go offscreen
            if (x + 160 + 140 > window.innerWidth) {
                ctxMenu.classList.add('left-submenus');
            } else {
                ctxMenu.classList.remove('left-submenus');
            }

            ctxMenu.style.left = x + 'px';
            ctxMenu.style.top = y + 'px';

            ctxMenu.querySelectorAll('.ctx-item').forEach(item => {
                item.onclick = (ev) => {
                    ev.stopPropagation();
                    const action = item.dataset.action;

                    let cmd = '';
                    const type = item.dataset.type || (item.closest('.has-submenu') ? item.closest('.has-submenu').dataset.type : null);

                    if (type === 'cd') cmd = `cd "${fullPath}"`;
                    else if (type === 'vim') cmd = `vim "${fullPath}"`;
                    else if (type === 'cat') cmd = `cat "${fullPath}"`;
                    else if (type === 'python') cmd = `python "${fullPath}"`;
                    else if (type === 'sh') cmd = `./"${fullPath.split('/').pop()}"`;

                    if (action === 'term') {
                        const termId = item.dataset.termid;
                        sendToTerminal(termId, cmd);
                        ctxMenu.style.display = 'none';
                    } else if (action === 'newterm') {
                        sendToNewTerminal(cmd);
                        ctxMenu.style.display = 'none';
                    } else if (action === 'copy') {
                        navigator.clipboard.writeText(item.dataset.val);
                        ctxMenu.style.display = 'none';
                    }
                };
            });
        });
    </script>
</body>
