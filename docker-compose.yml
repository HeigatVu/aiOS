services:
  sandbox:
    build:
      context: .
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    container_name: ai_tui_sandbox
    environment:
      - TERM=xterm-256color
      - COLORTERM=truecolor
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    ports:
      - "3113:3113"
      - "8501:8501"
      - "8888:8888"
    volumes:
      # 1. Code & Data
      - ./working-space:/workspace:rw,z
      - ./data:/data:rw,z
      - ./outputs:/outputs:rw,z
      
      # 2. Persistent ML Environments & Caches (Centralized inside sidecar-ui/)
      - ./sidecar-ui/ml-env:/home/ai_user/miniconda3/envs/ai-baseline:rw,z
      - ./sidecar-ui/uv-cache:/home/ai_user/.cache/uv:rw,z
      - ./sidecar-ui/conda-cache:/opt/conda/pkgs:rw,z

      # 3. Agent Configurations (Fixed Syntax: No spaces after commas)
      - ./agent-configs/.agentmemory:/home/ai_user/.agentmemory:rw,z
      - ./agent-configs/.claude:/home/ai_user/.claude:rw,z
      - ./agent-configs/.hermes:/home/ai_user/.hermes:rw,z
      - ./agent-configs/.gemini:/home/ai_user/.gemini:rw,z
      - ./agent-configs/.antigravitycli:/home/ai_user/.antigravitycli:rw,z
      - ./agent-configs/.agents:/home/ai_user/.agents:rw,z
      - ./agent-configs/.fcc:/home/ai_user/.fcc:rw,z
      - ./agent-configs/.iii:/home/ai_user/.iii:rw,z

      # 4. Shell Configurations (Read-Only)
      - ~/.p10k.zsh:/home/ai_user/.p10k.zsh:ro,z
      - ~/.zshrc:/home/ai_user/.zshrc_host:ro,z
      - ./agent-configs/.zshrc_docker:/home/ai_user/.zshrc:ro,z

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    stdin_open: true
    tty: true
    network_mode: "bridge"

  sidecar:
    build:
      context: ./sidecar-ui
      dockerfile: Dockerfile.sidecar
    container_name: ai_sidecar_controller
    ports:
      - "8502:8502"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:rw,z
    network_mode: "bridge"

