services:
  sandbox:
    build:
      context: .
      args:
        USER_ID: ${USER_ID:-2000}
        GROUP_ID: ${GROUP_ID:-2000}
    container_name: ai_tui_sandbox
    environment:
      - TERM=xterm-256color
      - COLORTERM=truecolor
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - HERMES_WEBUI_TRUST_FORWARDED_HOST=1
    ports:
      # Ports WITHOUT 127.0.0.1: prefix so they are reachable from any LAN device.
      # Do NOT add "127.0.0.1:" in front — that restricts access to localhost only.
      - "3113:3113" # agentmemory viewer (via viewer-proxy)
      - "8501:8501" # hermes-webui (upstream server.py)
      - "8888:8888"
      - "9119:9119" # Hermes dashboard (via dashboard-proxy)
      # General Development Ports (Left open for external testing)
      - "3000:3000"
      - "4000:4000"
      - "5000:5000"
      - "5173:5173"
      - "8000:8000"
      - "8080:8080"
      - "8081:8081"
      - "8443:8443"
      - "9000:9000"
      - "9001:9001"
      - "9090:9090"
    volumes:
      # 1. Code & Data
      - ./sandbox-data/working-space:/workspace:rw,z
      - ./sandbox-data/my-data:/my-data:ro,z
      - ./sandbox-data/outputs:/outputs:rw,z
      - ./config-file:/config-file:rw,z

      # 2. Persistent Caches & Environments
      - ./persistent/ml-env:/home/ai_user/miniconda3/envs/ai-baseline:rw,z
      - ./persistent/uv-cache:/home/ai_user/.cache/uv:rw,z
      - ./persistent/conda-pkgs:/home/ai_user/miniconda3/pkgs:rw,z

      # 3. Agent Configurations
      - ./persistent/agentmemory:/home/ai_user/.agentmemory:rw,z
      - ./persistent/hermes:/home/ai_user/.hermes:rw,z
      - ./persistent/gemini:/home/ai_user/.gemini:rw,z
      - ./persistent/agents:/home/ai_user/.agents:rw,z
      - ./persistent/iii:/home/ai_user/.iii:rw,z
      - ./persistent/reasonix:/home/ai_user/.reasonix:rw,z

      # 4. Shell Configurations
      - ./config-file/system-config/.p10k.zsh:/home/ai_user/.p10k.zsh:rw,z
      - ./config-file/system-config/.zshrc:/home/ai_user/.zshrc_host:rw,z
      - ./persistent/zshrc_docker:/home/ai_user/.zshrc:rw,z

      # 5. Editor Configurations
      - ./config-file/system-config/nvim:/home/ai_user/.config/nvim:rw,z

      # 6. Docker configs
      - ./aiOS-ui:/aiOS-ui:rw,z

    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 18G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # Auto-start the container when Docker daemon starts (e.g. on laptop boot).
    # Requires: sudo systemctl enable docker
    restart: always
    stdin_open: true
    tty: true
    network_mode: "bridge"
