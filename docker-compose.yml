services:
  sandbox:
    build:
      context: .
      args:
        USER_ID: ${UID:-1001}
        GROUP_ID: ${GID:-1001}
    container_name: ai_tui_sandbox
    environment:
      - TERM=xterm-256color
      - COLORTERM=truecolor
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    ports:
      - "127.0.0.1:3113:3113"
      - "127.0.0.1:8501:8501"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:9119:9119"
    volumes:
      # 1. Code & Data
      - ./working-space:/workspace:rw,z
      - ./data:/data:ro,z
      - ./outputs:/outputs:rw,z
      - ./config-file:/config-file:rw,z

      # 2. Persistent Caches & Environments
      - ./persistent/ml-env:/home/ai_user/miniconda3/envs/ai-baseline:rw,z
      - ./persistent/uv-cache:/home/ai_user/.cache/uv:rw,z
      - ./persistent/conda-pkgs:/home/ai_user/miniconda3/pkgs:rw,z

      # 3. Agent Configurations
      - ./persistent/agentmemory:/home/ai_user/.agentmemory:rw,z
      - ./persistent/claude:/home/ai_user/.claude:rw,z
      - ./persistent/hermes:/home/ai_user/.hermes:rw,z
      - ./persistent/gemini:/home/ai_user/.gemini:rw,z
      - ./persistent/agents:/home/ai_user/.agents:rw,z
      - ./persistent/fcc:/home/ai_user/.fcc:rw,z
      - ./persistent/iii:/home/ai_user/.iii:rw,z
      - ./persistent/feynman:/home/ai_user/.feynman:rw,z

      # 4. Shell Configurations
      - ./config-file/system-config/.p10k.zsh:/home/ai_user/.p10k.zsh:rw,z
      - ./config-file/system-config/.zshrc:/home/ai_user/.zshrc_host:rw,z
      - ./persistent/zshrc_docker:/home/ai_user/.zshrc:rw,z

      # 5. Editor Configurations
      - ./config-file/system-config/nvim:/home/ai_user/.config/nvim:rw,z

    cap_add:
      - SYS_ADMIN

    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 18G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped
    stdin_open: true
    tty: true
    network_mode: "bridge"

  sidecar:
    build:
      context: ./sidecar-ui
      dockerfile: Dockerfile.sidecar
    container_name: ai_sidecar_controller
    ports:
      - "127.0.0.1:8502:8502"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:rw,z
    restart: unless-stopped
    network_mode: "bridge"
